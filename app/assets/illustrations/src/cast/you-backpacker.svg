<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the backpacker</title>
  <desc>A backpacker in her twenties: a messy ginger top bun, sunglasses pushed up, a huge backpack with a rolled mat, a folded map held up, one brow raised, a little lost and loving it.</desc>
