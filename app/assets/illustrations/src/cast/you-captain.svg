<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the old captain</title>
  <desc>An old sea captain in his eighties: a white captain's cap with an anchor badge, a big white beard and bushy white brows, a rosy round nose, crinkly laughing eyes, a dark jacket with gold buttons, a toy sailboat held up proudly.</desc>
