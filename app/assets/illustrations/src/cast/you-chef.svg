      <path d="M -26 72 L -40 120 M 26 72 L 40 120" fill="none" stroke="#16181D" stroke-width="3"/>
      <circle cx="-22" cy="104" r="4" fill="#5B616B"/>
      <circle cx="22" cy="104" r="4" fill="#5B616B"/>
      <circle cx="-26" cy="126" r="4" fill="#5B616B"/>
      <circle cx="26" cy="126" r="4" fill="#5B616B"/>
      <circle class="skin" cx="-56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- short dark hair, grey at the temples -->
      <path d="M -58 -2 C -62 -30 -48 -50 -28 -54 L -22 -40 C -36 -36 -46 -26 -50 -10 Z M 58 -2 C 62 -30 48 -50 28 -54 L 22 -40 C 36 -36 46 -26 50 -10 Z" fill="#16181D" stroke="#16181D" stroke-width="4"/>
      <path d="M -54 -6 C -54 -20 -48 -30 -40 -36 M 54 -6 C 54 -20 48 -30 40 -36" fill="none" stroke="#F3F4F1" stroke-width="4"/>
