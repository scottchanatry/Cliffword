      <path d="M 11 -2 Q 22 -14 33 -2" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M -34 -24 Q -22 -32 -10 -26" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M 10 -26 Q 22 -32 34 -24" fill="none" stroke="#16181D" stroke-width="4"/>
      <ellipse cx="-36" cy="16" rx="9" ry="5.6" fill="#F7BBCB"/>
      <ellipse cx="36" cy="16" rx="9" ry="5.6" fill="#F7BBCB"/>
      <path d="M -4 6 Q 0 14 5 7" fill="none" stroke="#16181D" stroke-width="3"/>
