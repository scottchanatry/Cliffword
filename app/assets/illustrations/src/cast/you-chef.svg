<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the chef</title>
  <desc>A chef in his forties: a tall chef's hat tilted, a big ink mustache, grey at the temples, a white jacket with a teal neckerchief, eyes shut in bliss after tasting from a wooden spoon.</desc>
  <defs>
    <clipPath id="you-chef-1">
      <circle cx="128" cy="128" r="124" fill="#F08A1D"/>
    </clipPath>
    <clipPath id="you-chef-2">
      <path d="M -16 34 Q 0 32 16 34 Q 14 50 0 50 Q -14 50 -16 34 Z" fill="#16181D"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <circle cx="128" cy="128" r="124" fill="#F08A1D"/>
  <!-- the character, clipped to the disc -->
  <g clip-path="url(#you-chef-1)">
    <g transform="translate(118 146)">
      <rect class="skin" x="-16" y="40" width="32" height="40" rx="8" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
