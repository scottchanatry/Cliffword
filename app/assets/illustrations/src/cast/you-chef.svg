      <g transform="translate(6 -52) rotate(12)">
        <circle cx="-30" cy="-44" r="24" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
        <circle cx="30" cy="-44" r="24" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
        <circle cx="0" cy="-56" r="28" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
        <path d="M -48 -28 L -48 6 C -20 0 20 0 48 6 L 48 -28 Z" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
        <path d="M -16 -26 L -16 -2 M 16 -26 L 16 -2" fill="none" stroke="#16181D" stroke-width="3"/>
      </g>
      <!-- eyes shut in bliss -->
