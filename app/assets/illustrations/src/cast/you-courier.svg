<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the bike courier</title>
  <desc>A bike courier in his twenties: a coral bike helmet with vents and a chin strap, a sky t-shirt, a teal messenger bag on a deep amber strap across the chest, a breathless open grin, sweat flying.</desc>
  <defs>
    <clipPath id="you-courier-1">
      <circle cx="128" cy="128" r="124" fill="#5B616B"/>
    </clipPath>
    <clipPath id="you-courier-2">
      <path d="M -22 20 Q 0 24 22 20 Q 20 46 0 46 Q -20 46 -22 20 Z" fill="#16181D"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <circle cx="128" cy="128" r="124" fill="#5B616B"/>
  <!-- the character, clipped to the disc -->
  <g clip-path="url(#you-courier-1)">
    <g transform="translate(124 132)">
      <rect class="skin" x="-16" y="40" width="32" height="40" rx="8" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <path d="M -104 150 C -104 96 -64 70 0 70 C 64 70 104 96 104 150 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="4"/>
      <path class="skin" d="M -22 72 Q 0 90 22 72" fill="#FFC46B" stroke="#16181D" stroke-width="3"/>
      <!-- the bag strap, across the chest -->
      <path d="M 56 74 L -60 150" fill="none" stroke="#16181D" stroke-width="26"/>
      <path d="M 56 74 L -60 150" fill="none" stroke="#F08A1D" stroke-width="18"/>
      <rect x="-14" y="100" width="24" height="20" rx="4" fill="#5B616B" stroke="#16181D" stroke-width="3" transform="rotate(-33 -2 110)"/>
      <circle class="skin" cx="-56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- short ink hair under the helmet -->
      <path d="M -56 -4 C -58 -18 -54 -30 -46 -38 L -36 -30 C -44 -24 -48 -14 -50 -2 Z M 56 -4 C 58 -18 54 -30 46 -38 L 36 -30 C 44 -24 48 -14 50 -2 Z" fill="#16181D" stroke="#16181D" stroke-width="4"/>
      <path d="M -30 -38 L -24 -26 L -16 -36 L -8 -24 L 0 -36 L 8 -26 L 16 -38 Z" fill="#16181D" stroke="#16181D" stroke-width="4"/>
      <!-- the bike helmet -->
      <path d="M -54 -10 L -50 -18 L 50 -18 L 54 -10" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M -64 -26 C -66 -72 -34 -96 0 -96 C 36 -96 68 -74 66 -26 C 66 -18 60 -14 52 -16 C 30 -40 -30 -40 -52 -16 C -60 -14 -64 -18 -64 -26 Z" fill="#EF6A57" stroke="#16181D" stroke-width="4"/>
      <path d="M -36 -48 C -34 -64 -26 -76 -16 -82 M -4 -52 C -4 -68 0 -80 6 -88 M 28 -50 C 28 -64 26 -74 22 -82" fill="none" stroke="#16181D" stroke-width="9"/>
      <path d="M -52 -30 C -40 -40 -20 -46 0 -46" fill="none" stroke="#F3F4F1" stroke-width="4"/>
      <!-- the chin strap -->
      <path d="M -56 -14 C -54 14 -44 34 -26 46 M 56 -14 C 54 14 44 34 26 46" fill="none" stroke="#16181D" stroke-width="5"/>
      <!-- breathless: big bright eyes, a wide open grin, flushed cheeks, sweat -->
      <circle cx="-22" cy="-2" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="-21" cy="-1" r="7.3" fill="#16181D"/>
      <circle cx="-23.8" cy="-3.9" r="2.5" fill="#F3F4F1"/>
      <circle cx="22" cy="-2" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="23" cy="-1" r="7.3" fill="#16181D"/>
      <circle cx="20.2" cy="-3.9" r="2.5" fill="#F3F4F1"/>
      <path d="M -33 -21 Q -22 -26 -11 -21" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M 11 -21 Q 22 -26 33 -21" fill="none" stroke="#16181D" stroke-width="4"/>
      <ellipse cx="-36" cy="18" rx="11" ry="6.5" fill="#F7BBCB"/>
      <ellipse cx="36" cy="18" rx="11" ry="6.5" fill="#F7BBCB"/>
      <path d="M -4 6 Q 0 14 5 7" fill="none" stroke="#16181D" stroke-width="3"/>
      <path d="M -22 20 Q 0 24 22 20 Q 20 46 0 46 Q -20 46 -22 20 Z" fill="#16181D"/>
      <path d="M -18 22 Q 0 26 18 22 L 17 28 Q 0 31 -17 28 Z" fill="#F3F4F1" clip-path="url(#you-courier-2)"/>
      <ellipse cx="0" cy="46" rx="11" ry="8" fill="#EF6A57" clip-path="url(#you-courier-2)"/>
      <path d="M -22 20 Q 0 24 22 20 Q 20 46 0 46 Q -20 46 -22 20 Z" fill="none" stroke="#16181D" stroke-width="3"/>
    </g>
    <!-- sweat flying, puffs of breath -->
    <path d="M 52 70 C 46 78 46 84 52 86 C 58 84 58 78 52 70 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="3"/>
    <path d="M 198 66 C 192 74 192 80 198 82 C 204 80 204 74 198 66 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="3"/>
    <path d="M 40 100 L 28 96 M 210 98 L 222 92" fill="none" stroke="#F3F4F1" stroke-width="4"/>
    <!-- the messenger bag at the hip -->
    <g transform="translate(58 236) rotate(8)">
      <rect x="-50" y="-30" width="100" height="70" rx="10" fill="#2E9C92" stroke="#16181D" stroke-width="4"/>
      <path d="M -50 -20 C -50 -26 -46 -30 -40 -30 L 40 -30 C 46 -30 50 -26 50 -20 L 50 8 L -50 8 Z" fill="#2E9C92" stroke="#16181D" stroke-width="4"/>
      <path d="M -36 -16 L 36 -16" fill="none" stroke="#F3F4F1" stroke-width="4"/>
      <rect x="-9" y="0" width="18" height="16" rx="3" fill="#5B616B" stroke="#16181D" stroke-width="3"/>
    </g>
    <!-- a hand on the strap -->
    <circle class="skin" cx="164" cy="216" r="15" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
  </g>
</svg>
