<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the dad</title>
  <desc>A dad in his thirties: short brown hair and a short brown beard, a green shirt, a baby in a coral front carrier, a baby bottle in his hand with a drop of milk flying off, and dad and baby making the same surprised face.</desc>
