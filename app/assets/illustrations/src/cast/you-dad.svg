      <rect x="-17" y="-34" width="34" height="12" rx="4" fill="#2E9C92" stroke="#16181D" stroke-width="4"/>
      <rect x="-16" y="-22" width="32" height="58" rx="9" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
