    <clipPath id="you-dad-1">
      <circle cx="128" cy="128" r="124" fill="#FFE9C7"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <circle cx="128" cy="128" r="124" fill="#FFE9C7"/>
  <!-- the character, clipped to the disc -->
