    <path d="M 220 96 C 216 104 216 108 220 110 C 224 108 224 104 220 96 Z" fill="#F3F4F1" stroke="#16181D" stroke-width="2.5"/>
    <path d="M 230 104 L 238 100 M 228 116 L 236 118" fill="none" stroke="#16181D" stroke-width="2.5"/>
    <circle class="skin" cx="204" cy="196" r="15" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
