      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- short brown hair -->
      <path d="M -58 0 C -64 -46 -34 -70 0 -70 C 36 -70 64 -46 58 0 C 54 -14 50 -24 44 -32 C 24 -30 4 -36 -10 -48 C -18 -38 -32 -32 -46 -30 C -52 -22 -56 -12 -58 0 Z" fill="#B4530A" stroke="#16181D" stroke-width="4"/>
      <path d="M 10 -60 Q 26 -60 38 -50" fill="none" stroke="#F08A1D" stroke-width="3"/>
      <!-- a short beard -->
      <path d="M -57 8 C -58 40 -32 64 0 64 C 32 64 58 40 57 8 C 52 22 46 30 36 32 C 24 34 14 28 0 28 C -14 28 -24 34 -36 32 C -46 30 -52 22 -57 8 Z" fill="#B4530A" stroke="#16181D" stroke-width="4"/>
      <path d="M -22 24 C -12 16 12 16 22 24 C 14 26 6 26 0 24 C -6 26 -14 26 -22 24 Z" fill="#B4530A" stroke="#16181D" stroke-width="3"/>
      <!-- surprised -->
      <circle cx="-22" cy="-6" r="14" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="-22" cy="-6" r="6" fill="#16181D"/>
      <circle cx="-24" cy="-8" r="2" fill="#F3F4F1"/>
      <circle cx="22" cy="-6" r="14" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="22" cy="-6" r="6" fill="#16181D"/>
      <circle cx="20" cy="-8" r="2" fill="#F3F4F1"/>
      <path d="M -34 -32 Q -23 -42 -11 -34" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M 11 -34 Q 23 -42 34 -32" fill="none" stroke="#16181D" stroke-width="4"/>
      <ellipse cx="-38" cy="14" rx="8" ry="5" fill="#F7BBCB"/>
      <ellipse cx="38" cy="14" rx="8" ry="5" fill="#F7BBCB"/>
      <path d="M -4 6 Q 0 14 5 7" fill="none" stroke="#16181D" stroke-width="3"/>
      <ellipse cx="0" cy="38" rx="8" ry="10" fill="#16181D"/>
