<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the grandma</title>
  <desc>A grandma in her seventies: a wide pink beach hat with a big coral flower, white curls, huge round sunglasses, smile lines, a coral lipstick grin, pearls, a lilac blouse and a folding fan.</desc>
