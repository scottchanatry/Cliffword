      <circle cx="22" cy="-2" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="20" cy="-5" r="7.6" fill="#16181D"/>
      <circle cx="17.1" cy="-8" r="2.6" fill="#F3F4F1"/>
      <path d="M -34 -22 Q -23 -28 -12 -24" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M 12 -24 Q 23 -28 34 -22" fill="none" stroke="#16181D" stroke-width="4"/>
      <ellipse cx="35" cy="19" rx="9" ry="5.6" fill="#F7BBCB"/>
      <ellipse cx="-35" cy="19" rx="9" ry="5.6" fill="#F7BBCB"/>
      <!-- the smear of paint on the cheek -->
      <path d="M -48 8 L -26 24" fill="none" stroke="#2E9C92" stroke-width="9"/>
      <path d="M -46 20 L -34 28" fill="none" stroke="#2E9C92" stroke-width="5"/>
      <path d="M -4 8 Q 0 16 5 9" fill="none" stroke="#16181D" stroke-width="3"/>
      <path d="M -17 22 Q 0 26 17 22 Q 15 42 0 42 Q -15 42 -17 22 Z" fill="#16181D"/>
      <ellipse cx="0" cy="42" rx="9.5" ry="8" fill="#EF6A57" clip-path="url(#you-painter-2)"/>
      <path d="M -17 22 Q 0 26 17 22 Q 15 42 0 42 Q -15 42 -17 22 Z" fill="none" stroke="#16181D" stroke-width="3"/>
    </g>
    <!-- the palette, a thumb through the hole -->
    <g transform="translate(62 200) rotate(-14)">
      <path d="M -46 -6 C -50 -32 -20 -44 10 -40 C 38 -36 54 -18 48 4 C 44 20 26 22 16 14 C 8 8 -2 12 -2 22 C -2 32 -16 36 -30 28 C -42 22 -44 10 -46 -6 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <circle cx="-24" cy="-20" r="7.5" fill="#EF6A57" stroke="#16181D" stroke-width="2.5"/>
      <circle cx="-2" cy="-28" r="7.5" fill="#62AD52" stroke="#16181D" stroke-width="2.5"/>
      <circle cx="22" cy="-24" r="7.5" fill="#A8DBF0" stroke="#16181D" stroke-width="2.5"/>
      <circle cx="36" cy="-6" r="7" fill="#C3B3EA" stroke="#16181D" stroke-width="2.5"/>
      <circle cx="-30" cy="4" r="7" fill="#2E9C92" stroke="#16181D" stroke-width="2.5"/>
      <circle class="skin" cx="-16" cy="14" r="10" fill="#FFC46B" stroke="#16181D" stroke-width="3"/>
