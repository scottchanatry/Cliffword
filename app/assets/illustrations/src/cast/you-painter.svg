<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the painter</title>
  <desc>A painter in their early twenties, of no particular gender: a fluffy lilac mop, a paintbrush behind the ear, a teal smear of paint on the cheek, paint-splattered overalls over a white t-shirt, a palette held up with a thumb through the hole.</desc>
  <defs>
    <clipPath id="you-painter-1">
      <circle cx="128" cy="128" r="124" fill="#B4530A"/>
    </clipPath>
    <clipPath id="you-painter-2">
      <path d="M -17 22 Q 0 26 17 22 Q 15 42 0 42 Q -15 42 -17 22 Z" fill="#16181D"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <circle cx="128" cy="128" r="124" fill="#B4530A"/>
  <!-- the character, clipped to the disc -->
  <g clip-path="url(#you-painter-1)">
    <g transform="translate(134 124)">
      <rect class="skin" x="-16" y="40" width="32" height="40" rx="8" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- a white t-shirt under the overalls -->
      <path d="M -104 150 C -104 96 -64 70 0 70 C 64 70 104 96 104 150 Z" fill="#F3F4F1" stroke="#16181D" stroke-width="4"/>
      <path class="skin" d="M -20 72 Q 0 86 20 72" fill="#FFC46B" stroke="#16181D" stroke-width="3"/>
      <!-- the overalls: the bib, its straps and buttons, a pocket -->
      <path d="M -40 92 C -44 84 -48 78 -52 74 M 40 92 C 44 84 48 78 52 74" fill="none" stroke="#16181D" stroke-width="22"/>
      <path d="M -40 92 C -44 84 -48 78 -52 74 M 40 92 C 44 84 48 78 52 74" fill="none" stroke="#A8DBF0" stroke-width="14"/>
      <path d="M -50 150 L -46 90 Q 0 84 46 90 L 50 150 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="4"/>
      <circle cx="-36" cy="98" r="6" fill="#F08A1D" stroke="#16181D" stroke-width="3"/>
      <circle cx="36" cy="98" r="6" fill="#F08A1D" stroke="#16181D" stroke-width="3"/>
      <path d="M -18 108 L 18 108 L 16 134 L -16 134 Z" fill="none" stroke="#16181D" stroke-width="3"/>
      <!-- paint splatters -->
      <circle cx="-22" cy="118" r="10" fill="#EF6A57"/>
      <circle cx="-8" cy="104" r="4" fill="#EF6A57"/>
      <circle cx="-36" cy="132" r="4" fill="#EF6A57"/>
      <circle cx="24" cy="122" r="9" fill="#62AD52"/>
      <circle cx="34" cy="110" r="4" fill="#62AD52"/>
      <circle cx="-74" cy="104" r="10" fill="#2E9C92"/>
      <circle cx="-62" cy="92" r="4" fill="#2E9C92"/>
      <circle cx="-86" cy="118" r="4" fill="#2E9C92"/>
      <circle cx="74" cy="100" r="9" fill="#F08A1D"/>
      <circle cx="86" cy="112" r="4" fill="#F08A1D"/>
      <circle cx="62" cy="86" r="4" fill="#F08A1D"/>
      <circle cx="-58" cy="80" r="5" fill="#C3B3EA"/>
      <circle class="skin" cx="-56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- the brush, tucked behind the right ear -->
      <g transform="translate(62 -16) rotate(28)">
        <rect x="-4.5" y="-14" width="9" height="62" rx="4.5" fill="#B4530A" stroke="#16181D" stroke-width="3"/>
        <rect x="-6" y="-26" width="12" height="14" rx="2" fill="#5B616B" stroke="#16181D" stroke-width="3"/>
        <path d="M -6 -26 C -8 -38 -4 -48 0 -54 C 4 -48 8 -38 6 -26 Z" fill="#2E9C92" stroke="#16181D" stroke-width="3"/>
      </g>
      <circle class="skin" cx="56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- a fluffy lilac mop -->
      <path d="M -60 10 C -72 -10 -66 -40 -48 -54 C -44 -74 -18 -84 0 -76 C 18 -86 46 -76 50 -56 C 66 -44 70 -18 60 0 C 54 -14 50 -22 44 -26 C 40 -20 30 -18 24 -24 C 16 -16 2 -18 -4 -26 C -12 -18 -26 -18 -32 -26 C -38 -20 -46 -18 -50 -20 C -54 -12 -58 0 -60 10 Z" fill="#C3B3EA" stroke="#16181D" stroke-width="4"/>
      <path d="M -30 -56 Q -20 -64 -8 -62 M 14 -64 Q 26 -64 34 -56" fill="none" stroke="#16181D" stroke-width="3"/>
