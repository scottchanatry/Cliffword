      <rect x="-46" y="-52" width="92" height="12" rx="4" fill="#EF6A57" stroke="#16181D" stroke-width="3"/>
      <path d="M -100 -26 C -96 -46 -60 -50 0 -50 C 60 -50 96 -46 100 -26 C 80 -36 40 -40 0 -40 C -40 -40 -80 -36 -100 -26 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="4"/>
      <!-- a wink, smile lines -->
