      <path d="M -40 -8 L -46 -12 M -40 0 L -47 0" fill="none" stroke="#16181D" stroke-width="2.5"/>
      <circle cx="22" cy="-4" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="22" cy="-3" r="7.3" fill="#16181D"/>
      <circle cx="19.2" cy="-5.9" r="2.5" fill="#F3F4F1"/>
      <path d="M 40 -8 L 46 -12 M 40 0 L 47 0" fill="none" stroke="#16181D" stroke-width="2.5"/>
      <path d="M -34 -20 Q -22 -24 -10 -18" fill="none" stroke="#16181D" stroke-width="4"/>
