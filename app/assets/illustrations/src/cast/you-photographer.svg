      <path d="M -72 92 L -72 150 M 72 92 L 72 150" fill="none" stroke="#16181D" stroke-width="3"/>
      <!-- the camera strap -->
      <path d="M -38 74 C -46 96 -40 116 -30 124 M 38 74 C 46 96 40 116 30 124" fill="none" stroke="#16181D" stroke-width="12"/>
      <path d="M -38 74 C -46 96 -40 116 -30 124 M 38 74 C 46 96 40 116 30 124" fill="none" stroke="#EF6A57" stroke-width="5"/>
      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <path d="M -60 18 C -66 -24 -48 -48 -10 -48 C -8 -38 -18 -24 -42 -18 C -50 -12 -54 0 -56 18 Z M 60 18 C 66 -24 48 -48 2 -48 C 8 -36 26 -26 42 -18 C 50 -12 54 0 56 18 Z" fill="#5B616B" stroke="#16181D" stroke-width="4"/>
      <path d="M -54 -16 C -56 -8 -58 2 -58 12 M 54 -16 C 56 -8 58 2 58 12" fill="none" stroke="#F3F4F1" stroke-width="4"/>
