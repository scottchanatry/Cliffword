<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the photographer</title>
  <desc>A photographer in her fifties: a wide sky-blue sun hat, a salt-and-pepper grey bob, smile lines, a wink as if lining up a shot, a big camera on a strap round the neck.</desc>
  <defs>
    <clipPath id="you-photographer-1">
      <circle cx="128" cy="128" r="124" fill="#F7BBCB"/>
    </clipPath>
    <clipPath id="you-photographer-2">
      <path d="M -16 24 Q 0 22 16 24 Q 15 40 0 40 Q -15 40 -16 24 Z" fill="#16181D"/>
    </clipPath>
  </defs>
  <!-- the disc -->
