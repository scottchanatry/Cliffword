<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" stroke-linejoin="round" stroke-linecap="round">
  <title>You, the surfer</title>
  <desc>A surfer in her mid twenties: long, messy, sun-bleached hair, a big laugh, an ink wetsuit top with sky shoulders, a surfboard under her arm.</desc>
  <defs>
    <clipPath id="you-surfer-1">
      <circle cx="128" cy="128" r="124" fill="#2E9C92"/>
    </clipPath>
    <clipPath id="you-surfer-2">
      <path d="M -18 22 Q 0 26 18 22 Q 16 44 0 44 Q -16 44 -18 22 Z" fill="#16181D"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <circle cx="128" cy="128" r="124" fill="#2E9C92"/>
  <!-- the character, clipped to the disc -->
  <g clip-path="url(#you-surfer-1)">
    <g transform="translate(140 130)">
      <!-- long messy hair, behind -->
      <path d="M -62 -10 C -80 20 -80 56 -70 86 L -58 78 L -54 96 L -40 82 L 40 82 L 54 96 L 58 78 L 70 86 C 80 56 80 20 62 -10 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <rect class="skin" x="-16" y="40" width="32" height="40" rx="8" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- the wetsuit top: a high collar, sky shoulders -->
      <path d="M -104 150 C -104 96 -64 70 0 70 C 64 70 104 96 104 150 Z" fill="#16181D" stroke="#16181D" stroke-width="4"/>
      <path d="M -96 112 C -84 88 -60 74 -26 72 L -22 86 C -50 90 -70 100 -82 122 Z M 96 112 C 84 88 60 74 26 72 L 22 86 C 50 90 70 100 82 122 Z" fill="#A8DBF0" stroke="#16181D" stroke-width="3"/>
      <path d="M -20 62 L 20 62 L 22 84 Q 0 90 -22 84 Z" fill="#16181D" stroke="#16181D" stroke-width="4"/>
      <path d="M -16 70 L 16 70" fill="none" stroke="#5B616B" stroke-width="3"/>
      <!-- locks over the shoulders -->
      <path d="M -58 8 C -70 34 -70 60 -62 84 L -52 74 L -46 88 C -44 64 -46 40 -44 22 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <path d="M 58 8 C 70 34 70 60 62 84 L 52 74 L 46 88 C 44 64 46 40 44 22 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="-56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="56" cy="6" r="13" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <circle class="skin" cx="0" cy="0" r="58" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
      <!-- messy sun-bleached hair, swept to one side, strands flying -->
      <path d="M 4 -72 C 8 -86 20 -92 32 -88 C 26 -84 22 -78 22 -70 Z M 30 -70 C 40 -80 54 -80 62 -72 C 52 -70 46 -64 44 -56 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <path d="M -60 12 C -70 -30 -58 -56 -40 -64 C -34 -74 -18 -76 -8 -72 C 2 -80 18 -80 28 -72 C 42 -72 56 -60 62 -44 C 68 -30 66 -10 60 12 C 56 -6 52 -20 46 -28 L 40 -18 C 36 -30 30 -38 24 -44 C 12 -34 -2 -28 -10 -28 L -14 -18 L -22 -28 L -32 -16 L -38 -26 C -46 -18 -52 -6 -54 6 Z" fill="#FFE9C7" stroke="#16181D" stroke-width="4"/>
      <path d="M 20 -62 C 8 -50 -10 -42 -26 -40 M 40 -54 C 34 -44 26 -40 22 -36 M -50 -36 C -54 -28 -56 -18 -56 -8" fill="none" stroke="#F08A1D" stroke-width="3"/>
      <!-- a big laugh -->
      <circle cx="-22" cy="-2" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="-21" cy="-2" r="7.6" fill="#16181D"/>
      <circle cx="-23.9" cy="-5" r="2.6" fill="#F3F4F1"/>
      <circle cx="22" cy="-2" r="13" fill="#F3F4F1" stroke="#16181D" stroke-width="3"/>
      <circle cx="23" cy="-2" r="7.6" fill="#16181D"/>
      <circle cx="20.1" cy="-5" r="2.6" fill="#F3F4F1"/>
      <path d="M -34 -22 Q -22 -30 -10 -24" fill="none" stroke="#16181D" stroke-width="4"/>
      <path d="M 10 -24 Q 22 -30 34 -22" fill="none" stroke="#16181D" stroke-width="4"/>
      <ellipse cx="-36" cy="20" rx="9" ry="5.6" fill="#F7BBCB"/>
      <ellipse cx="36" cy="20" rx="9" ry="5.6" fill="#F7BBCB"/>
      <path d="M -4 8 Q 0 16 5 9" fill="none" stroke="#16181D" stroke-width="3"/>
      <path d="M -18 22 Q 0 26 18 22 Q 16 44 0 44 Q -16 44 -18 22 Z" fill="#16181D"/>
      <ellipse cx="0" cy="44" rx="10" ry="8" fill="#EF6A57" clip-path="url(#you-surfer-2)"/>
      <path d="M -18 22 Q 0 26 18 22 Q 16 44 0 44 Q -16 44 -18 22 Z" fill="none" stroke="#16181D" stroke-width="3"/>
