      <path d="M 0 -136 L 0 150" fill="none" stroke="#EF6A57" stroke-width="5"/>
      <path d="M -30 -6 C -10 -14 10 -14 31 -6" fill="none" stroke="#EF6A57" stroke-width="7"/>
      <path d="M -31 8 C -10 0 10 0 32 8" fill="none" stroke="#F08A1D" stroke-width="7"/>
    </g>
    <!-- the arm round the board: a sky sleeve, the forearm, the hand on the rail -->
    <path d="M 96 232 C 84 220 74 218 64 222" fill="none" stroke="#16181D" stroke-width="40"/>
    <path d="M 96 232 C 84 220 74 218 64 222" fill="none" stroke="#A8DBF0" stroke-width="32"/>
    <path d="M 70 222 L 52 226" fill="none" stroke="#16181D" stroke-width="30"/>
    <path class="skin" d="M 70 222 L 52 226" fill="none" stroke="#FFC46B" stroke-width="22"/>
    <circle class="skin" cx="46" cy="226" r="15" fill="#FFC46B" stroke="#16181D" stroke-width="4"/>
  </g>
</svg>
